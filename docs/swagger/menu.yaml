openapi: 3.0.0
info:
  title: Menu API
  description: Backend v1.0 – OCR → Approval → Commit flow
  version: "1.0.0"

paths:
  /api/ocr/parse:
    post:
      summary: Upload menu image and parse via OCR
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed OCR output

  /api/menu/map:
    post:
      summary: Fuzzy map parsed OCR menu to existing categories/items
      responses:
        "200":
          description: Mapping suggestions returned

  /api/menu/commit:
    post:
      summary: Commit approved menu to database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitPayload"
      responses:
        "200":
          description: Commit successful
        "400":
          description: Invalid payload
        "409":
          description: Business conflict
        "500":
          description: System failure

components:
  schemas:
    CommitPayload:
      type: object
      required:
        - restaurantId
        - mapping
      properties:
        restaurantId:
          type: string
        mapping:
          type: array
          items:
            type: object
            required:
              - category
              - items
            properties:
              category:
                type: string
              items:
                type: array
                items:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    price:
                      type: number
                      nullable: true
                    matchedItemId:
                      type: string
                      nullable: true
